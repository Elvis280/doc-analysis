[project]
name = "rag-kb-generator"
version = "0.1.0"
description = "Converts PDFs into structured, retrieval-ready knowledge bases using Gemini."
readme = "README.md"
authors = [
    { name = "Elvis280", email = "devansh28sharma@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "groq>=1.7.0",
    "jinja2>=3.1.6",
    "pydantic>=2.13.5",
    "pymupdf>=1.28.2",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "tenacity>=9.1.2",
    "uvicorn>=0.53.0",
]

[project.scripts]
rag-kb-generator = "rag_kb_generator:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
